    // --- Interactive Tax & Rounding Calculator Component ---
    function TaxCalculator() {
      const [outletType, setOutletType] = useState('FSR');
      const [subtotal, setSubtotal] = useState(100.00);
      const [paymentMethod, setPaymentMethod] = useState('CASH');

      const serviceCharge = outletType === 'FSR' ? subtotal * 0.10 : 0.00;
      const taxableAmount = subtotal + serviceCharge;
      const sst = taxableAmount * 0.06;
      const rawTotal = subtotal + serviceCharge + sst;

      // BNM 5-sen rounding logic
      let roundedTotal = rawTotal;
      let roundingAdjustment = 0;

      if (paymentMethod === 'CASH') {
        const cents = Math.round((rawTotal % 0.10) * 100);
        let targetCents = 0;
        if (cents === 1 || cents === 2) targetCents = 0;
        else if (cents >= 3 && cents <= 7) targetCents = 5;
        else if (cents >= 8 || cents === 9) targetCents = 10;
        const base = Math.floor(rawTotal * 10) / 10;
        roundedTotal = Number((base + targetCents / 100).toFixed(2));
        roundingAdjustment = Number((roundedTotal - rawTotal).toFixed(2));
      }

      return (
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
          <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
            <h3 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
              <span>🇲🇾</span> Interactive Malaysian Tax & Rounding Simulator
            </h3>
            <span class="text-xs px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full font-mono">
              Live Engine
            </span>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Outlet Format</label>
              <div class="grid grid-cols-2 gap-2">
                <button 
                  onClick={() => setOutletType('FSR')}
                  class={`py-2 px-3 rounded-lg text-sm font-semibold transition ${outletType === 'FSR' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/40' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                  🍽️ FSR (10% SC)
                </button>
                <button 
                  onClick={() => setOutletType('QSR')}
                  class={`py-2 px-3 rounded-lg text-sm font-semibold transition ${outletType === 'QSR' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/40' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                  🥤 QSR Kiosk (0% SC)
                </button>
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Subtotal Amount (MYR)</label>
              <input 
                type="number" 
                step="0.05"
                min="0"
                value={subtotal} 
                onChange={(e) => setSubtotal(parseFloat(e.target.value) || 0)}
                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white font-mono focus:outline-none focus:border-emerald-500"
              />
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Payment Method</label>
              <div class="grid grid-cols-2 gap-2">
                <button 
                  onClick={() => setPaymentMethod('CASH')}
                  class={`py-2 px-3 rounded-lg text-sm font-semibold transition ${paymentMethod === 'CASH' ? 'bg-amber-600 text-white shadow-lg shadow-amber-900/40' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                  💵 Cash (BNM 5¢)
                </button>
                <button 
                  onClick={() => setPaymentMethod('DUITNOW')}
                  class={`py-2 px-3 rounded-lg text-sm font-semibold transition ${paymentMethod === 'DUITNOW' ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/40' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                  📱 DuitNow (Exact)
                </button>
              </div>
            </div>
          </div>

          <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 font-mono text-sm space-y-2">
            <div class="flex justify-between text-slate-400">
              <span>Food & Beverage Subtotal:</span>
              <span class="text-white">RM {subtotal.toFixed(2)}</span>
            </div>
            <div class="flex justify-between text-slate-400">
              <span>Service Charge ({outletType === 'FSR' ? '10%' : '0%'}):</span>
              <span class="text-white">RM {serviceCharge.toFixed(2)}</span>
            </div>
            <div class="flex justify-between text-slate-400">
              <span>Service Tax (SST 6%):</span>
              <span class="text-white">RM {sst.toFixed(2)}</span>
            </div>
            <div class="flex justify-between text-slate-400 border-t border-slate-800 pt-2">
              <span>Calculated Raw Total:</span>
              <span class="text-white">RM {rawTotal.toFixed(2)}</span>
            </div>
            {paymentMethod === 'CASH' && (
              <div class="flex justify-between text-amber-400">
                <span>BNM 5-Sen Rounding Adjustment:</span>
                <span>{roundingAdjustment >= 0 ? `+RM ${roundingAdjustment.toFixed(2)}` : `-RM ${Math.abs(roundingAdjustment).toFixed(2)}`}</span>
              </div>
            )}

                    },
                    {
                      category: "Malaysian Compliance",
                      items: [
                        "10% Service Charge + 6% SST cascading tax calculation engine.",
                        "Bank Negara Malaysia 5-sen cash rounding for cash payments.",
                        "LHDN MyInvois monthly B2C consolidated batch generation.",
                        "LHDN instant B2B e-invoice with receipt QR code and UUID.",
                        "Supplier Halal certification tracking and 60-day expiry escalation."
                      ]
                    },
                    {
                      category: "Hardware & Printing",
                      items: [
                        "Direct raw TCP socket printing to 80mm thermal receipt printers.",
                        "Multi-station kitchen routing (Hot Kitchen, Cold Prep, Drink Bar).",
                        "Cash drawer kick pulse (10 14 01 00 05) on settlement.",
                        "Customer Facing Display (CFD) with dynamic DuitNow QR.",
                        "Real-time audio chime alerts for overdue kitchen orders."
                      ]
                    }
                  ].map((cat, idx) => (
                    <div key={idx} class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                      <h4 class="text-sm font-bold text-emerald-400 mb-3 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        {cat.category}
                      </h4>
                      <ul class="space-y-2 text-xs text-slate-300">
                        {cat.items.map((item, i) => (
                          <li key={i} class="flex items-start gap-2">
                            <span class="text-slate-500">•</span>
                            <span>{item}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 4: MALAYSIAN COMPLIANCE MATRIX */}
            {activeTab === 'compliance' && (
              <div class="space-y-6">
                <div>
                  <h3 class="text-xl font-bold text-white mb-1">Malaysian Statutory Compliance Matrix</h3>
                  <p class="text-xs text-slate-400">Strict alignment with LHDN, JKDM, BNM, JAKIM, and KKM frameworks</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {STATUTORY_ITEMS.map(item => (
                    <div key={item.id} class="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition">
                      <div class="text-xs font-mono text-emerald-400 font-semibold mb-1">{item.mandate}</div>
                      <h4 class="text-base font-bold text-white mb-2">{item.name}</h4>
                      <p class="text-xs text-slate-300 leading-relaxed">{item.desc}</p>
                    </div>
                  ))}
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 mt-6">
                  <h4 class="text-sm font-bold text-emerald-400 mb-3">LHDN MyInvois e-Invoicing Architecture (Malaysia)</h4>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs text-slate-300">
                    <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
                      <div class="font-bold text-white mb-2 flex items-center gap-2">
                        <span class="text-teal-400 font-bold">1.</span> B2C Consolidated Workflow
                      </div>
                      <p class="leading-relaxed text-slate-400">
                        For everyday walk-in diners who do not request an individual corporate tax receipt. The local POS records transactions normally. At the end of every calendar month, the Vercel Cron worker groups all non-TIN sales into an aggregated XML/JSON payload and submits it to LHDN within 7 calendar days.
                      </p>
                    </div>

                    <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
                      <div class="font-bold text-white mb-2 flex items-center gap-2">
                        <span class="text-emerald-400 font-bold">2.</span> B2B / Corporate Dining Workflow
                      </div>
                      <p class="leading-relaxed text-slate-400">
                        For corporate customers requesting tax deduction claims. The cashier inputs the customer’s Tax Identification Number (TIN) and Company Registration. The system calls the MyInvois API in real-time, receives an official UUID, and prints the verification QR code directly on the 80mm thermal receipt.
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: PROJECT ROADMAP */}
            {activeTab === 'roadmap' && (
              <div class="space-y-6">
                <div>
                  <h3 class="text-xl font-bold text-white mb-1">4-Sprint Master Implementation Roadmap</h3>
                  <p class="text-xs text-slate-400">16-week execution plan from schema design to live flagship rollout</p>
                </div>

                <div class="space-y-4">
                  {ROADMAP_PHASES.map((phase, idx) => (
                    <div key={idx} class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="text-xs font-mono font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
                              {phase.period}
                            </span>
                            <h4 class="text-base font-bold text-white">{phase.phase}</h4>
                          </div>
                          <p class="text-xs text-slate-400 mt-1">{phase.focus}</p>
                        </div>
                        <div class="w-full md:w-48">
                          <div class="flex justify-between text-xs font-mono text-slate-400 mb-1">
                            <span>Status</span>
                            <span>{phase.progress}%</span>
                          </div>
                          <div class="w-full bg-slate-800 rounded-full h-2">
                            <div class="bg-emerald-500 h-2 rounded-full transition-all" style={{ width: `${phase.progress}%` }}></div>
                          </div>
                        </div>
                      </div>

                      <div class="border-t border-slate-800 pt-3">
                        <div class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Key Milestones & Deliverables</div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-slate-300">
                          {phase.deliverables.map((item, i) => (
                            <div key={i} class="flex items-center gap-2">
                              <span class="text-emerald-400 font-bold">✓</span>
                              <span>{item}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 6: TASK MATRIX & ANTIGRAVITY AGENT BLUEPRINT */}
            {activeTab === 'tasks' && (
              <div class="space-y-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h3 class="text-xl font-bold text-white mb-1">Work Breakdown Structure (WBS) & Antigravity Delegation</h3>
                    <p class="text-xs text-slate-400">Total {TASKS.length} tasks ({totalDays} engineering days) directly executable in Antigravity</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="text-xs text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-lg border border-emerald-500/20 font-mono">
                      Subagent Ready
                    </span>
                  </div>
                </div>

                {/* Filter and Search Bar */}
                <div class="flex flex-col sm:flex-row gap-3">
                  <div class="flex-1 relative">
                    <input 
                      type="text" 
                      placeholder="Search tasks by ID, title, or keyword..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      class="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div class="flex gap-2 overflow-x-auto pb-1 sm:pb-0 custom-scrollbar">
                    {['ALL', 'Architecture', 'FOH POS', 'Compliance', 'Hardware', 'Payments', 'Inventory'].map(epic => (
                      <button
                        key={epic}
                        onClick={() => setFilterEpic(epic)}
                        class={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${
                          filterEpic === epic 
                            ? 'bg-emerald-600 text-white shadow-sm' 
                            : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'
                        }`}>
                        {epic}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Task Cards */}
                <div class="space-y-3">
                  {filteredTasks.map(task => (
                    <div 
                      key={task.id} 
                      class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-5 transition shadow-sm">
                      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="flex items-start gap-3">
                          <span class="font-mono text-xs px-2.5 py-1 bg-slate-800 text-emerald-400 border border-slate-700 rounded font-semibold whitespace-nowrap">
                            {task.id}
                          </span>
                          <div>
                            <h4 class="text-sm font-bold text-white flex items-center gap-2">
                              {task.title}
                            </h4>
                            <p class="text-xs text-slate-400 mt-1 leading-relaxed">{task.desc}</p>
                          </div>
                        </div>

                        <div class="flex items-center gap-2 self-start sm:self-auto">
                          <span class={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                            task.priority === 'Critical' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' :
                            task.priority === 'High' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                            'bg-blue-500/20 text-blue-400 border border-blue-500/30'
                          }`}>
                            {task.priority}
                          </span>
                          <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-slate-800 text-slate-300 border border-slate-700">
                            {task.days}d
                          </span>
                          <button
                            onClick={() => setExpandedTask(expandedTask === task.id ? null : task.id)}
                            class="text-xs px-2.5 py-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded font-semibold transition">
                            {expandedTask === task.id ? 'Hide Prompt' : 'Agent Prompt'}
                          </button>
                        </div>
                      </div>

                      {/* Expanded Antigravity Subagent Details */}
                      {expandedTask === task.id && (
                        <div class="mt-4 pt-4 border-t border-slate-800 space-y-2">
                          <div class="flex items-center gap-2 text-xs">
                            <span class="text-slate-400">Assigned Agent Role:</span>
                            <span class="font-bold text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">{task.agentRole}</span>
                          </div>
                          <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 text-xs font-mono text-emerald-300">
                            <div class="text-[10px] text-slate-500 uppercase font-bold mb-1">Delegation Prompt Template:</div>
                            {task.agentPrompt}
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 7: POSTGRESQL SCHEMAS */}
            {activeTab === 'database' && (
              <div class="space-y-6">
                <div>
                  <h3 class="text-xl font-bold text-white mb-1">Neon Serverless PostgreSQL Schema (DDL)</h3>
                  <p class="text-xs text-slate-400">Complete relational database definition for multi-outlet FSR & QSR operations</p>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                  <pre class="bg-slate-950 p-4 rounded-lg border border-slate-800 font-mono text-xs text-emerald-300 overflow-x-auto leading-relaxed custom-scrollbar">
{`-- Schema: nexus_fnb
CREATE SCHEMA IF NOT EXISTS nexus_fnb;

-- 1. Outlets & Profiles
CREATE TABLE nexus_fnb.outlets (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    code VARCHAR(16) UNIQUE NOT NULL,       -- e.g. 'FSR-BANGSAR-01', 'QSR-KLCC-01'
    name VARCHAR(128) NOT NULL,
    outlet_type VARCHAR(8) NOT NULL CHECK (outlet_type IN ('FSR', 'QSR')),
    sst_registration_number VARCHAR(32),
    is_sst_enabled BOOLEAN DEFAULT TRUE,
    service_charge_percent NUMERIC(5,2) DEFAULT 10.00,
    has_central_kitchen_link BOOLEAN DEFAULT TRUE,
    address_line1 VARCHAR(255) NOT NULL,
    state VARCHAR(64) NOT NULL,
    postcode VARCHAR(10) NOT NULL,
    created_at TIMESTAMPTZ DEFAULT NOW(),
    updated_at TIMESTAMPTZ DEFAULT NOW()
);

-- 2. Halal & Health Tracking (Raw Materials)
CREATE TABLE nexus_fnb.ingredients (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    sku VARCHAR(32) UNIQUE NOT NULL,
    name VARCHAR(128) NOT NULL,
    uom VARCHAR(16) NOT NULL,               -- 'KG', 'GRAM', 'LITER', 'ML', 'UNIT'
    current_cost_per_unit NUMERIC(10,4) NOT NULL,
    supplier_name VARCHAR(128) NOT NULL,
    is_halal_certified BOOLEAN DEFAULT TRUE,
    halal_cert_body VARCHAR(64),            -- 'JAKIM', 'MUIS', etc.
    halal_cert_number VARCHAR(64),
    halal_cert_expiry DATE,
    shelf_life_days INT DEFAULT 7,
    created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 3. Menu Items & Recipe Bill of Materials (BOM)
CREATE TABLE nexus_fnb.menu_items (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    sku VARCHAR(32) UNIQUE NOT NULL,
    name VARCHAR(128) NOT NULL,
    category VARCHAR(64) NOT NULL,          -- 'MAINS', 'BEVERAGES', 'SIDES', 'DESSERT'
    base_price NUMERIC(10,2) NOT NULL,
    kitchen_station VARCHAR(32) NOT NULL,   -- 'HOT_KITCHEN', 'DRINK_BAR', 'COLD_PREP'
    is_active BOOLEAN DEFAULT TRUE,
    packaging_fee NUMERIC(5,2) DEFAULT 0.00
);

CREATE TABLE nexus_fnb.recipe_bom (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    menu_item_id UUID REFERENCES nexus_fnb.menu_items(id) ON DELETE CASCADE,
    ingredient_id UUID REFERENCES nexus_fnb.ingredients(id),
    quantity_required NUMERIC(10,4) NOT NULL,
    wastage_allowance_percent NUMERIC(5,2) DEFAULT 5.00
);

-- 4. Floor & Table Management (FSR Only)
CREATE TABLE nexus_fnb.dining_tables (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    outlet_id UUID REFERENCES nexus_fnb.outlets(id),
    table_number VARCHAR(16) NOT NULL,
    section VARCHAR(32) DEFAULT 'MAIN_DINING', -- 'INDOOR', 'OUTDOOR', 'VIP'
    capacity INT DEFAULT 4,
    status VARCHAR(16) DEFAULT 'VACANT' CHECK (status IN ('VACANT', 'SEATED', 'ORDERED', 'SERVED', 'BILL_OUT')),
    active_order_id UUID,
    UNIQUE(outlet_id, table_number)
);

-- 5. Orders & Financial Transactions
CREATE TABLE nexus_fnb.orders (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    outlet_id UUID REFERENCES nexus_fnb.outlets(id),
    order_number VARCHAR(32) NOT NULL,
    queue_token INT,                        -- 101, 102 for QSR
    table_id UUID REFERENCES nexus_fnb.dining_tables(id),
    order_mode VARCHAR(16) NOT NULL CHECK (order_mode IN ('DINE_IN', 'TAKEAWAY', 'DELIVERY')),
    
    subtotal_gross NUMERIC(10,2) NOT NULL,
    discount_total NUMERIC(10,2) DEFAULT 0.00,
    service_charge_amount NUMERIC(10,2) DEFAULT 0.00,
    sst_amount NUMERIC(10,2) DEFAULT 0.00,            -- 6%
    rounding_adjustment NUMERIC(5,2) DEFAULT 0.00,   -- BNM 5-sen rule
    total_payable NUMERIC(10,2) NOT NULL,
    
    payment_method VARCHAR(24),
    payment_status VARCHAR(16) DEFAULT 'PENDING' CHECK (payment_status IN ('PENDING', 'PAID', 'VOIDED', 'REFUNDED')),
    
    lhdn_status VARCHAR(16) DEFAULT 'PENDING' CHECK (lhdn_status IN ('PENDING', 'VALIDATED', 'CONSOLIDATED', 'EXEMPT')),
    lhdn_uuid VARCHAR(64),
    lhdn_validation_url TEXT,
    
    created_at TIMESTAMPTZ DEFAULT NOW(),
    closed_at TIMESTAMPTZ
);

-- 6. Shift Management (X/Z Reports)
CREATE TABLE nexus_fnb.shifts (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    outlet_id UUID REFERENCES nexus_fnb.outlets(id),
    cashier_id UUID NOT NULL,
    opened_at TIMESTAMPTZ DEFAULT NOW(),
    closed_at TIMESTAMPTZ,
    opening_float NUMERIC(10,2) NOT NULL,
    expected_cash_end NUMERIC(10,2),
    actual_cash_end NUMERIC(10,2),
    cash_variance NUMERIC(10,2),
    status VARCHAR(16) DEFAULT 'OPEN' CHECK (status IN ('OPEN', 'CLOSED'))
);`}
                  </pre>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
            <div class="max-w-7xl mx-auto px-4">
              Nexus FnB Business Management System (Malaysia Edition) • 100% Vercel Native • Single Source of Truth (SSOT)
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
