    // --- Interactive Tax & Rounding Calculator Component ---
    function TaxCalculator() {
      const [outletType, setOutletType] = useState('FSR');
      const [subtotal, setSubtotal] = useState(100.00);
      const [paymentMethod, setPaymentMethod] = useState('CASH');

      const serviceCharge = outletType === 'FSR' ? subtotal * 0.10 : 0.00;
      const taxableAmount = subtotal + serviceCharge;
      const sst = taxableAmount * 0.06;
      const rawTotal = subtotal + serviceCharge + sst;

      // BNM 5-sen rounding logic
      let roundedTotal = rawTotal;
      let roundingAdjustment = 0;

      if (paymentMethod === 'CASH') {
        const cents = Math.round((rawTotal % 0.10) * 100);
        let targetCents = 0;
        if (cents === 1 || cents === 2) targetCents = 0;
        else if (cents >= 3 && cents <= 7) targetCents = 5;
        else if (cents === 8 || cents === 9) targetCents = 10;
        const base = Math.floor(rawTotal * 10) / 10;
        roundedTotal = Number((base + targetCents / 100).toFixed(2));
        roundingAdjustment = Number((roundedTotal - rawTotal).toFixed(2));
      }

      return (
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">

            </h3>

              Live Engine
            </span>
          </div>

                <button 
                  onClick={() => setOutletType('FSR')}
                  class={`py-2 px-3 rounded-lg text-sm font-semibold transition ${outletType === 'FSR' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/40' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                  🍽️ FSR (10% SC)
                </button>
                <button 
                  onClick={() => setOutletType('QSR')}
                  class={`py-2 px-3 rounded-lg text-sm font-semibold transition ${outletType === 'QSR' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/40' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                  🥤 QSR Kiosk (0% SC)
                </button>
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Subtotal Amount (MYR)</label>
              <input 
                type="number" 
                step="0.05"
                min="0"
                value={subtotal} 
                onChange={(e) => setSubtotal(parseFloat(e.target.value) || 0)}
                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white font-mono focus:outline-none focus:border-emerald-500"
              />
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Payment Method</label>
              <div class="grid grid-cols-2 gap-2">
                <button

                  class={`py-2 px-3 rounded-lg text-sm font-semibold transition ${paymentMethod === 'CASH' ? 'bg-amber-600 text-white shadow-lg shadow-amber-900/40' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>

                <button

    }

                          {phase.deliverables.map((item, i) => (
                            <div key={i} class="flex items-center gap-2">
                              <span class="text-emerald-400 font-bold">✓</span>
                              <span>{item}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 6: TASK BREAKDOWN (WBS) */}
            {activeTab === 'tasks' && (
              <div class="space-y-6">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <h3 class="text-xl font-bold text-white mb-1">Work Breakdown Structure (WBS)</h3>
                    <p class="text-xs text-slate-400">Total Estimated Effort: <strong class="text-emerald-400">{totalDays} Engineer Days</strong> across {TASKS.length} tasks</p>
                  </div>

                  <div class="flex flex-wrap items-center gap-2">
                    <input 
                      type="text"
                      placeholder="Search tasks..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                    />
                    <select 
                      value={filterEpic}
                      onChange={(e) => setFilterEpic(e.target.value)}
                      class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500"
                    >
                      <option value="ALL">All Epics</option>
                      <option value="Architecture">Architecture</option>
                      <option value="FOH POS">FOH POS</option>
                      <option value="Compliance">Compliance & Tax</option>
                      <option value="Hardware">Hardware & Printing</option>
                      <option value="Payments">Payments</option>
                      <option value="Inventory">Inventory</option>
                      <option value="Halal & Health">Halal & Health</option>
                    </select>
                  </div>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
                  <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left text-xs">
                      <thead class="bg-slate-950 text-slate-400 uppercase font-mono border-b border-slate-800">
                        <tr>
                          <th class="py-3 px-4">Task ID</th>
                          <th class="py-3 px-4">Epic</th>
                          <th class="py-3 px-4">Title & Description</th>
                          <th class="py-3 px-4 text-center">Days</th>
                          <th class="py-3 px-4 text-center">Priority</th>
                          <th class="py-3 px-4 text-center">Status</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-800">
                        {filteredTasks.map(task => (
                          <tr key={task.id} class="hover:bg-slate-800/50 transition">
                            <td class="py-3 px-4 font-mono font-bold text-emerald-400 whitespace-nowrap">{task.id}</td>
                            <td class="py-3 px-4 whitespace-nowrap">
                              <span class="px-2 py-0.5 bg-slate-800 rounded text-slate-300 border border-slate-700">
                                {task.epic}
                              </span>
                            </td>
                            <td class="py-3 px-4">
                              <div class="font-bold text-white mb-0.5">{task.title}</div>
                              <div class="text-slate-400 text-[11px] leading-relaxed">{task.desc}</div>
                            </td>
                            <td class="py-3 px-4 text-center font-mono text-slate-300">{task.days}d</td>
                            <td class="py-3 px-4 text-center whitespace-nowrap">
                              <span class={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                                task.priority === 'Critical' ? 'bg-red-500/20 text-red-400 border border-red-500/30' :
                                task.priority === 'High' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                                'bg-slate-800 text-slate-300'
                              }`}>
                                {task.priority}
                              </span>
                            </td>
                            <td class="py-3 px-4 text-center whitespace-nowrap">
                              <span class={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                                task.status === 'Done' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                                task.status === 'Ready' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' :
                                'bg-slate-800 text-slate-400'
                              }`}>
                                {task.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 7: POSTGRESQL SCHEMAS */}
            {activeTab === 'database' && (
              <div class="space-y-6">
                <div>
                  <h3 class="text-xl font-bold text-white mb-1">PostgreSQL Production DDL (Schema: nexus_fnb)</h3>
                  <p class="text-xs text-slate-400">Production-ready database definition for multi-outlet FSR & QSR operations</p>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                  <pre class="bg-slate-950 p-4 rounded-lg border border-slate-800 font-mono text-xs text-emerald-300 overflow-x-auto leading-relaxed custom-scrollbar">
{`-- Schema: nexus_fnb
CREATE SCHEMA IF NOT EXISTS nexus_fnb;

-- 1. Outlets & Profiles
CREATE TABLE nexus_fnb.outlets (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    code VARCHAR(16) UNIQUE NOT NULL,       -- e.g. 'FSR-BANGSAR-01', 'QSR-KLCC-01'
    name VARCHAR(128) NOT NULL,
    outlet_type VARCHAR(8) NOT NULL CHECK (outlet_type IN ('FSR', 'QSR')),
    sst_registration_number VARCHAR(32),
    is_sst_enabled BOOLEAN DEFAULT TRUE,
    service_charge_percent NUMERIC(5,2) DEFAULT 10.00,
    has_central_kitchen_link BOOLEAN DEFAULT TRUE,
    address_line1 VARCHAR(255) NOT NULL,
    state VARCHAR(64) NOT NULL,
    postcode VARCHAR(10) NOT NULL,
    created_at TIMESTAMPTZ DEFAULT NOW(),
    updated_at TIMESTAMPTZ DEFAULT NOW()
);

-- 2. Halal & Health Tracking (Raw Materials)
CREATE TABLE nexus_fnb.ingredients (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    sku VARCHAR(32) UNIQUE NOT NULL,
    name VARCHAR(128) NOT NULL,
    uom VARCHAR(16) NOT NULL,               -- 'KG', 'GRAM', 'LITER', 'ML', 'UNIT'
    current_cost_per_unit NUMERIC(10,4) NOT NULL,
    supplier_name VARCHAR(128) NOT NULL,
    is_halal_certified BOOLEAN DEFAULT TRUE,
    halal_cert_body VARCHAR(64),            -- 'JAKIM', 'MUIS', etc.
    halal_cert_number VARCHAR(64),
    halal_cert_expiry DATE,
    shelf_life_days INT DEFAULT 7,
    created_at TIMESTAMPTZ DEFAULT NOW()
);

-- 3. Menu Items & Recipe Bill of Materials (BOM)
CREATE TABLE nexus_fnb.menu_items (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    sku VARCHAR(32) UNIQUE NOT NULL,
    name VARCHAR(128) NOT NULL,
    category VARCHAR(64) NOT NULL,          -- 'MAINS', 'BEVERAGES', 'SIDES', 'DESSERT'
    base_price NUMERIC(10,2) NOT NULL,
    kitchen_station VARCHAR(32) NOT NULL,   -- 'HOT_KITCHEN', 'DRINK_BAR', 'COLD_PREP'
    is_active BOOLEAN DEFAULT TRUE,
    packaging_fee NUMERIC(5,2) DEFAULT 0.00
);

CREATE TABLE nexus_fnb.recipe_bom (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    menu_item_id UUID REFERENCES nexus_fnb.menu_items(id) ON DELETE CASCADE,
    ingredient_id UUID REFERENCES nexus_fnb.ingredients(id),
    quantity_required NUMERIC(10,4) NOT NULL,
    wastage_allowance_percent NUMERIC(5,2) DEFAULT 5.00
);

-- 4. Floor & Table Management (FSR Only)
CREATE TABLE nexus_fnb.dining_tables (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    outlet_id UUID REFERENCES nexus_fnb.outlets(id),
    table_number VARCHAR(16) NOT NULL,
    section VARCHAR(32) DEFAULT 'MAIN_DINING', -- 'INDOOR', 'OUTDOOR', 'VIP'
    capacity INT DEFAULT 4,
    status VARCHAR(16) DEFAULT 'VACANT' CHECK (status IN ('VACANT', 'SEATED', 'ORDERED', 'SERVED', 'BILL_OUT')),
    active_order_id UUID,
    UNIQUE(outlet_id, table_number)
);

-- 5. Orders & Financial Transactions
CREATE TABLE nexus_fnb.orders (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    outlet_id UUID REFERENCES nexus_fnb.outlets(id),
    order_number VARCHAR(32) NOT NULL,
    queue_token INT,                        -- 101, 102 for QSR
    table_id UUID REFERENCES nexus_fnb.dining_tables(id),
    order_mode VARCHAR(16) NOT NULL CHECK (order_mode IN ('DINE_IN', 'TAKEAWAY', 'DELIVERY')),
    
    subtotal_gross NUMERIC(10,2) NOT NULL,
    discount_total NUMERIC(10,2) DEFAULT 0.00,
    service_charge_amount NUMERIC(10,2) DEFAULT 0.00,
    sst_amount NUMERIC(10,2) DEFAULT 0.00,            -- 6%
    rounding_adjustment NUMERIC(5,2) DEFAULT 0.00,   -- BNM 5-sen rule
    total_payable NUMERIC(10,2) NOT NULL,
    
    payment_method VARCHAR(24),
    payment_status VARCHAR(16) DEFAULT 'PENDING' CHECK (payment_status IN ('PENDING', 'PAID', 'VOIDED', 'REFUNDED')),
    
    lhdn_status VARCHAR(16) DEFAULT 'PENDING' CHECK (lhdn_status IN ('PENDING', 'VALIDATED', 'CONSOLIDATED', 'EXEMPT')),
    lhdn_uuid VARCHAR(64),
    lhdn_validation_url TEXT,
    
    created_at TIMESTAMPTZ DEFAULT NOW(),
    closed_at TIMESTAMPTZ
);`}
                  </pre>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
            <div class="max-w-7xl mx-auto px-4">
              Nexus FnB Business Management System (Malaysia Edition) • Proprietary & Confidential • Central Source of Truth (SSOT)
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
